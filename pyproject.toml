[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemeos"
version = "0.1.0"
description = "Evidence-first kernel for computational research workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
episteme = "episteme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
