name: kernel checks

on: [push, pull_request]

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m pip install uv==0.11.28
      - run: python -m unittest discover -s tests -v
      - name: container role profile
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        env:
          EPISTEME_CONTAINER_TEST: "1"
        run: |
          docker pull busybox:1.36.1
          python -m unittest tests.test_role_profile.ContainerRoleProfileTests -v
